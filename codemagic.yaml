cat > codemagic.yaml <<'EOF'
workflows:
  xynova-android:
    name: Xynova Android Release
    max_build_duration: 120

    environment:
      flutter: stable

    scripts:
      - name: Flutter doctor
        script: |
          flutter --version
          flutter doctor -v

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze project
        script: |
          flutter analyze

      - name: Build Xynova APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/*.apk
